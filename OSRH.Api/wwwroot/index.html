<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSRH Platform</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; }
        
        /* Login Styles */
        #login-section { max-width: 350px; margin: 50px auto; text-align: center; padding: 40px; border: 1px solid #eee; border-radius: 8px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        /* Buttons */
        .nav-buttons { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
        
        /* --- ΔΙΟΡΘΩΣΗ: Αφαιρέθηκε ο HTML κώδικας από εδώ --- */
        .action-buttons { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
        }
        
        button { padding: 10px 20px; font-size: 14px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; transition: background 0.3s; }
        button:hover { background-color: #0056b3; }
        button.logout { background-color: #dc3545; }
        button.logout:hover { background-color: #a71d2a; }

        /* Table Styles - RESPONSIVE FIX */
        .table-container {
            width: 100%;
            overflow-x: auto; /* Επιτρέπει οριζόντιο scroll αν ο πίνακας είναι μεγάλος */
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            min-width: 800px; /* Ελάχιστο πλάτος για να μην στριμώχνονται τα δεδομένα */
        }
        
        th, td { 
            padding: 12px 15px; 
            text-align: left; 
            border-bottom: 1px solid #ddd; 
            white-space: nowrap; /* Κρατάει το κείμενο σε μία γραμμή */
        }
        
        th { background-color: #f8f9fa; font-weight: 600; color: #333; }
        tr:hover { background-color: #f1f1f1; }
        
        .hidden { display: none; }
        #loading { font-style: italic; color: #666; margin: 10px 0; }
    </style>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>
<body>

<div class="container">
    <div id="login-section">
        <h1>OSRH Login</h1>
        <input type="text" id="username" placeholder="Όνομα Χρήστη (π.χ. sophia_admin)">
        <input type="password" id="password" placeholder="Κωδικός">
        <button onclick="login()" style="width:100%; margin-top:10px;">Είσοδος</button>
        <p id="login-msg" style="color:red; margin-top:10px; font-size:0.9em;"></p>
    </div>

<div id="dashboard-section" class="hidden">
    <div class="nav-buttons">
        <h3>Καλωσήρθες, <span id="user-display" style="color:#007bff;"></span></h3>
        <button onclick="logout()" class="logout">Έξοδος</button>
    </div>

    <div class="action-buttons">
        <div id="admin-features" class="hidden">
            <button onclick="loadReport('cost')">Αναφορά Κόστους (Admin)</button>
            <button onclick="loadReport('driver-performance')">Απόδοση Οδηγών (Admin)</button>
            <button onclick="loadPendingDocuments()" style="background-color: #ffc107; color: black;">Έλεγχος Εγγράφων (Operator)</button>
        </div>
        
        <div id="driver-features" class="hidden">
            <button onclick="loadOpenRequests()">Ανοιχτά Αιτήματα (Οδηγός)</button>
            <button onclick="loadAvailability()" style="background-color: #17a2b8;">Η Διαθεσιμότητά μου</button>
        </div>

        <div id="passenger-features" class="hidden">
            <button onclick="showRequestForm()" style="background-color: #28a745;">Νέα Διαδρομή (Επιβάτης)</button>
            <button onclick="loadPassengerHistory()" style="background-color: #17a2b8;">Ιστορικό (Επιβάτης)</button>
        </div>
    </div>
    
    <div id="offers-section" class="hidden" style="margin-top: 20px;">
        <h3>Διαθέσιμες Επιλογές & Χάρτης Διαδρομής</h3>
        <div id="map" style="height: 300px; width: 100%; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc;"></div>
        <div id="offers-container" style="display: flex; gap: 15px; flex-wrap: wrap;"></div>
        <button onclick="closeOffers()" style="margin-top:10px; background-color:#6c757d;">Κλείσιμο Προσφορών</button>
    </div>
    
    <div id="request-form" class="hidden" style="margin-top: 20px; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
        <h3>Αίτημα Διαδρομής</h3>
        <label>Υπηρεσία:</label>
        <select id="service-select">
            <option value="1">Standard</option><option value="2">Premium</option>
            <option value="3">Delivery</option><option value="4">XL</option>
        </select>
        <br><br>
        <label>Σημειώσεις:</label>
        <input type="text" id="request-notes" placeholder="π.χ. Περιμένω στη γωνία">
        <button onclick="submitRequest()" style="margin-top: 10px;">Αποστολή Αιτήματος</button>
    </div>

    <div id="document-form" class="hidden" style="margin-top: 20px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background: #fdfdfd;">
        <h3>Υποβολή Νέου Εγγράφου</h3>
        <label>Τύπος Εγγράφου:</label>
        <select id="doc-type"><option value="Driving License">Άδεια Οδήγησης</option><option value="Identity Card">Ταυτότητα</option><option value="Medical Certificate">Ιατρικό Πιστοποιητικό</option></select>
        <label>Αριθμός Εγγράφου:</label><input type="text" id="doc-number" placeholder="π.χ. A1234567">
        <label>Link Αρχείου (URL):</label><input type="text" id="doc-url" placeholder="https://docs.osrh-project.com/lic/v2.pdf">
        <label>Ημ. Έκδοσης:</label><input type="date" id="doc-issue">
        <label>Ημ. Λήξης:</label><input type="date" id="doc-expiry">
        <button onclick="submitDocument()" style="margin-top: 10px; background-color: #28a745;">Υποβολή</button>
    </div>


    <h2 id="table-title" style="margin-top: 30px;">Αποτελέσματα</h2>
    <div id="loading" class="hidden">Φόρτωση δεδομένων...</div>
    
    <div class="table-container">
        <table id="data-table">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

            <h3>Αίτημα Διαδρομής</h3>
            <label>Υπηρεσία:</label>
            <select id="service-select">
                <option value="1">Standard</option>

                <option value="3">Delivery</option>

            </select>

            <label>Σημειώσεις:</label>
            <input type="text" id="request-notes" placeholder="π.χ. Περιμένω στη γωνία">
            <br>
            <button onclick="submitRequest()" style="margin-top: 10px;">Αποστολή Αιτήματος</button>
            <button onclick="document.getElementById('request-form').classList.add('hidden')" style="background-color: #6c757d;">Ακύρωση</button>
        </div>

        <div id="offers-section" class="hidden" style="margin-top: 20px;">
            <h3>Διαθέσιμες Επιλογές & Χάρτης Διαδρομής</h3>

            <div id="map" style="height: 300px; width: 100%; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc;"></div>

            <div id="offers-container" style="display: flex; gap: 15px; flex-wrap: wrap;">
                </div>
            <button onclick="closeOffers()" style="margin-top:10px; background-color:#6c757d;">Κλείσιμο</button>
        </div>


        <h2 id="table-title" style="margin-top: 30px;">Αποτελέσματα</h2>
        <div id="loading" class="hidden">Φόρτωση δεδομένων...</div>
        
        <div class="table-container">
            <table id="data-table">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/site.js"></script>
</body>
</html>
