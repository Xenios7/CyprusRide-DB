<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSRH Platform</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #333; }
        
        #login-section { max-width: 350px; margin: 50px auto; text-align: center; padding: 40px; border: 1px solid #eee; border-radius: 8px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        .nav-buttons { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        
        button { padding: 10px 20px; font-size: 14px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; transition: background 0.3s; }
        button:hover { background-color: #0056b3; }
        button.logout { background-color: #dc3545; }
        button.logout:hover { background-color: #a71d2a; }

        .table-container { width: 100%; overflow-x: auto; margin-top: 20px; border: 1px solid #ddd; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; white-space: nowrap; }
        th { background-color: #f8f9fa; font-weight: 600; color: #333; }
        tr:hover { background-color: #f1f1f1; }
        
        .card { background: #fdfdfd; padding: 20px; margin-top: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        
        .hidden { display: none; }
        #loading { font-style: italic; color: #666; margin: 10px 0; }
    </style>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<div class="container">
    <!-- LOGIN -->
    <div id="login-section">
        <h1>OSRH Login</h1>
        <input type="text" id="username" placeholder="Όνομα Χρήστη (π.χ. sophia_admin)">
        <input type="password" id="password" placeholder="Κωδικός">
        <button onclick="login()" style="width:100%; margin-top:10px;">Είσοδος</button>
        <p id="login-msg" style="color:red; margin-top:10px; font-size:0.9em;"></p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-section" class="hidden">
        <div class="nav-buttons">
            <h3>Καλωσήρθες, <span id="user-display" style="color:#007bff;"></span></h3>
            <button onclick="logout()" class="logout">Έξοδος</button>
        </div>

        <!-- ROLE BUTTONS -->
        <div class="action-buttons">
            <div id="admin-features" class="hidden">
                <button onclick="loadReport('cost')">Αναφορά Κόστους (Admin)</button>
                <button onclick="loadReport('driver-performance')">Απόδοση Οδηγών (Admin)</button>
            </div>

            <div id="operator-features" class="hidden">
                <button onclick="loadPendingDocuments()" style="background-color: #ffc107; color: black;">Έλεγχος Εγγράφων (Operator)</button>
            </div>
            
            <div id="driver-features" class="hidden">
                <button onclick="loadOpenRequests()">Διαθέσιμα Αιτήματα (Οδηγός)</button>
                <button onclick="loadAvailability()" style="background-color: #17a2b8;">Η Διαθεσιμότητά μου</button>
                <button onclick="showUploadForm()" style="background-color: #ffc107;">Υποβολή Εγγράφου</button>
                <button onclick="showAddShiftForm()" style="background-color: #28a745;">➕ Προσθήκη Βάρδιας</button>
            </div>

            <div id="passenger-features" class="hidden">
                <button onclick="showRequestForm()" style="background-color: #28a745;">Νέα Διαδρομή (Επιβάτης)</button>
                <button onclick="loadPassengerHistory()" style="background-color: #17a2b8;">Ιστορικό (Επιβάτης)</button>
            </div>
        </div>

        <!-- OFFERS SECTION (for passengers) -->
        <div id="offers-section" class="hidden" style="margin-top: 20px;">
            <h3>Διαθέσιμες Επιλογές & Χάρτης Διαδρομής</h3>
            <div id="map" style="height: 300px; width: 100%; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc;"></div>
            <div id="offers-container" style="display: flex; gap: 15px; flex-wrap: wrap;"></div>
            <button onclick="closeOffers()" style="margin-top:10px; background-color:#6c757d;">Κλείσιμο Προσφορών</button>
        </div>
        
        <!-- PASSENGER REQUEST FORM -->
        <div id="request-form" class="hidden card">
            <h3>Αίτημα Διαδρομής</h3>
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Υπηρεσία:</label>
                <select id="service-select" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                    <option value="1">Standard - Regular ride (€5+ base)</option>
                    <option value="2">Premium - Luxury vehicle (€10+ base)</option>
                    <option value="3">Delivery - Package delivery (€6+ base)</option>
                    <option value="4">XL - Large vehicle (€8+ base)</option>
                </select>
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">📍 Τοποθεσία Παραλαβής:</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="pickup-lat" placeholder="Latitude" value="35.1700" 
                        style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px;" step="0.0001">
                    <input type="number" id="pickup-lon" placeholder="Longitude" value="33.3600" 
                        style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px;" step="0.0001">
                </div>
                <small style="color: #666;">Nicosia City Center (default)</small>
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">🎯 Τοποθεσία Προορισμού:</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="dropoff-lat" placeholder="Latitude" value="34.9200" 
                        style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px;" step="0.0001">
                    <input type="number" id="dropoff-lon" placeholder="Longitude" value="33.6300" 
                        style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px;" step="0.0001">
                </div>
                <small style="color: #666;">Limassol City Center (default)</small>
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">📝 Σημειώσεις (προαιρετικά):</label>
                <textarea id="request-notes" placeholder="π.χ. Περιμένω στη γωνία, έχω βαλίτσες..."
                    style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; resize: vertical;" rows="3"></textarea>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button onclick="submitRequest()" style="flex: 1; padding: 12px; background-color: #28a745; color: white; font-size: 16px; border: none; border-radius: 4px; cursor: pointer;">
                    📤 Αποστολή Αιτήματος
                </button>
                <button onclick="document.getElementById('request-form').classList.add('hidden')" 
                    style="flex: 0.3; padding: 12px; background-color: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">
                    Ακύρωση
                </button>
            </div>
        </div>

        <!-- DRIVER: ADD SHIFT FORM -->
        <div id="add-shift-form" class="hidden card">
            <h3>Προσθήκη Νέας Βάρδιας</h3>
            
            <div class="form-group">
                <label>Ημέρα:</label>
                <select id="shift-day" class="form-control">
                    <option value="1">Δευτέρα</option>
                    <option value="2">Τρίτη</option>
                    <option value="3">Τετάρτη</option>
                    <option value="4">Πέμπτη</option>
                    <option value="5">Παρασκευή</option>
                    <option value="6">Σάββατο</option>
                    <option value="7">Κυριακή</option>
                </select>
            </div>

            <div class="form-group">
                <label>Ώρα Έναρξης:</label>
                <input type="time" id="shift-start" value="09:00">
            </div>

            <div class="form-group">
                <label>Ώρα Λήξης:</label>
                <input type="time" id="shift-end" value="17:00">
            </div>

            <button onclick="submitShift()" style="background-color: #28a745;">Αποθήκευση</button>
            <button onclick="document.getElementById('add-shift-form').classList.add('hidden')" style="background-color: #6c757d; margin-left: 10px;">Ακύρωση</button>
        </div>

        <!-- DRIVER: DOCUMENT UPLOAD FORM -->
        <div id="document-form" class="hidden card">
            <h3>Υποβολή Νέου Εγγράφου</h3>
            <label>Τύπος Εγγράφου:</label>
            <select id="doc-type">
                <option value="Driving License">Άδεια Οδήγησης</option>
                <option value="Identity Card">Ταυτότητα</option>
                <option value="Medical Certificate">Ιατρικό Πιστοποιητικό</option>
            </select>
            <label>Αριθμός Εγγράφου:</label>
            <input type="text" id="doc-number" placeholder="π.χ. A1234567">
            <label>Link Αρχείου (URL):</label>
            <input type="text" id="doc-url" placeholder="https://docs.osrh-project.com/lic/v2.pdf">
            <label>Ημ. Έκδοσης:</label>
            <input type="date" id="doc-issue">
            <label>Ημ. Λήξης:</label>
            <input type="date" id="doc-expiry">
            <button onclick="submitDocument()" style="margin-top: 10px; background-color: #28a745;">Υποβολή</button>
        </div>

        <!-- DATA TABLE -->
        <h2 id="table-title" style="margin-top: 30px;">Αποτελέσματα</h2>
        <div id="loading" class="hidden">Φόρτωση δεδομένων...</div>
        
        <div class="table-container">
            <table id="data-table">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/site.js"></script>
</body>
</html>
